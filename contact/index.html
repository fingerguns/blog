  <body>
    <article class="post">
      <a class="post-back" href="../about/" aria-label="Back to About">←</a>
      <h1>Contact</h1>
      <form id="contact-form" class="contact-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="7" required></textarea>
        </div>
        <!-- Left empty by people; bots fill it in (worker/contact.mjs drops those). -->
        <div class="field contact-hp" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
        </div>
        <button type="submit" id="submit-btn">Send</button>
        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>
      <div id="contact-sent" class="contact-sent" role="status" tabindex="-1" hidden>
        <p class="contact-sent-title">Message sent.</p>
        <p>Thanks, <span id="contact-sent-name"></span>. I'll reply to <strong id="contact-sent-email"></strong> from me@rommy.blog — check your spam folder if you don't see it.</p>
        <p><a href="/contact/" id="contact-again">Send another message</a></p>
      </div>

    <script>
      // Messages go to the site's own Worker (/api/contact) and land in the
      // admin inbox; replies come from me@rommy.blog.
      var form = document.getElementById("contact-form");
      var status = document.getElementById("form-status");
      var btn = document.getElementById("submit-btn");
      var openedAt = Date.now();

      function fail(msg) {
        status.textContent = msg;
        status.className = "form-status form-error";
        btn.disabled = false;
        btn.textContent = "Send";
      }

      document.getElementById("contact-again").addEventListener("click", function (e) {
        e.preventDefault();
        document.getElementById("contact-sent").hidden = true;
        form.hidden = false;
        btn.disabled = false;
        btn.textContent = "Send";
        openedAt = Date.now();
        form.elements.name.focus();
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        btn.disabled = true;
        btn.textContent = "Sending…";
        status.textContent = "";
        status.className = "form-status";
        try {
          var res = await fetch("/api/contact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: form.elements.name.value,
              email: form.elements.email.value,
              message: form.elements.message.value,
              website: form.elements.website.value,
              elapsed_ms: Date.now() - openedAt,
            }),
          });
          var data = {};
          try { data = await res.json(); } catch (_) {}
          if (res.ok && data.ok) {
            var sent = document.getElementById("contact-sent");
            document.getElementById("contact-sent-name").textContent = form.elements.name.value.trim().split(/\s+/)[0];
            document.getElementById("contact-sent-email").textContent = form.elements.email.value.trim();
            form.reset();
            form.hidden = true;
            sent.hidden = false;
            sent.focus();
          } else {
            fail(data.error || "Something went wrong. Please try again.");
          }
        } catch (err) {
          fail("Network error. Please try again.");
        }
      });
    </script>
