  <body>
    <article class="post">
      <a class="post-back" href="../about/">←</a>
      <h1>Contact</h1>
      <form id="contact-form" class="contact-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="7" required></textarea>
        </div>
        <button type="submit" id="submit-btn">Send</button>
        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>
      <footer class="site-footer">
        <p class="footer-row"><span>&copy; 2026 Rommy Ghaly (<a href="/admin/">admin</a>)</span><a href="#" class="theme-toggle" id="theme-toggle"></a></p>
        <p class="footer-row"><span><a href="../feed.xml" type="application/atom+xml">Atom feed</a> or <a href="https://buttondown.com/rommy" target="_blank" rel="noopener">Buttondown</a></span><span><a href="/search/">Search</a> // <a href="/changelog/">Changelog</a> // <a href="/colophon/">Colophon</a></span></p>
      </footer>
    </article>
    <script>(function(){var b=document.getElementById('theme-toggle');if(!b)return;var h=document.documentElement;function set(t){h.setAttribute('data-theme',t);b.textContent=t==='dark'?'Light mode':'Dark mode';localStorage.setItem('theme',t);}set(localStorage.getItem('theme')||'light');b.addEventListener('click',function(e){e.preventDefault();set(h.getAttribute('data-theme')==='dark'?'light':'dark');});}());</script>
    <script>
      var FORMSPREE_ID = "YOUR_FORM_ID"; // Replace with your Formspree form ID
      var form = document.getElementById("contact-form");
      var status = document.getElementById("form-status");
      var btn = document.getElementById("submit-btn");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        btn.disabled = true;
        btn.textContent = "Sending…";
        status.textContent = "";
        status.className = "form-status";
        try {
          var res = await fetch("https://formspree.io/f/" + FORMSPREE_ID, {
            method: "POST",
            headers: { Accept: "application/json" },
            body: new FormData(form),
          });
          if (res.ok) {
            form.reset();
            form.hidden = true;
            status.textContent = "Message sent. Thank you!";
            status.className = "form-status form-success";
          } else {
            var data = await res.json();
            status.textContent = data.errors
              ? data.errors.map(function (e) { return e.message; }).join(" ")
              : "Something went wrong. Please try again.";
            status.className = "form-status form-error";
            btn.disabled = false;
            btn.textContent = "Send";
          }
        } catch (err) {
          status.textContent = "Network error. Please try again.";
          status.className = "form-status form-error";
          btn.disabled = false;
          btn.textContent = "Send";
        }
      });
    </script>
  </body>
</html>
