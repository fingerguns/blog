name: Manual rebuild

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        env:
          DEPLOY_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "PAGES_DEPLOY_HOOK not set — skipping"
            exit 0
          fi
          curl -sf -X POST "$DEPLOY_HOOK"
