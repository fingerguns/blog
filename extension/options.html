<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Share to rommy.blog — Options</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body { min-width: 380px; }
      main { padding: 16px; max-width: 460px; }
      h1 { margin: 0 0 0.5rem; font-size: 16px; }
      p { margin: 0 0 0.9rem; color: var(--muted); }
      .row { display: flex; gap: 8px; margin-top: 0.8rem; }
      code { font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Share to rommy.blog</h1>
      <p>
        Paste the share token, the <code>SHARE_TOKEN</code> secret on the
        rommy-blog-admin Worker (the same one your Share Shortcut uses). It can only add
        Sharing links. It stays in this browser and isn't synced.
      </p>
      <label class="label" for="token">Share token</label>
      <input type="password" id="token" autocomplete="off" spellcheck="false" />
      <div class="row">
        <button type="button" id="save">Save and test</button>
        <button type="button" class="secondary" id="clear">Remove</button>
      </div>
      <p class="status" id="status" role="status" hidden></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
